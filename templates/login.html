    <div
      class="container"
      style="
        background-color: white;
        padding: 20px;

        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        margin: 0 auto;
      "
    >
      <div>
        <!-- <h2 class="form-signin-heading">Trap Net</h2> -->
        <form class="form-signin" action="" method="POST">
          <img id="logo" src="/images/logo_trap.png" />
          <h4 class="form-signin-heading">Sign in</h4>
          {{template "flashes" .Flashes}}

          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Username"
            required
            autofocus
            style="margin: 20px 0; border-radius: 0"
          />

          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            autocomplete="off"
            required
            style="margin: 20px 0; border-radius: 0"
          />
          <input type="hidden" name="csrf_token" value="{{.Token}}" />
          <button
            class="btn btn-lg btn-primary btn-block"
            type="submit"
            style="border-radius: 0"
          >
            Sign in
          </button>
        </form>
      </div>
    </div>
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
  </body>
