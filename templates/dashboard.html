{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
  <h3 class="page-header">Dashboard</h3>

  <div class="row" style="display: flex; gap: 10px; margin: 20px 0">
    <div
      id="email_sent_chart"
      class="card"
      style="
        flex: 1;
        min-width: 200px;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #0d47a1;
        color: white;
        text-align: center;
        font-weight: bold;
      "
    >
      <h3>Email Sent <span id="sent_value">0</span></h3>
    </div>
    <div
      id="email_opened_chart"
      class="card"
      style="
        flex: 1;
        min-width: 200px;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #08660d;
        color: white;
        text-align: center;
        font-weight: bold;
      "
    >
      <h3>Email Opened <span id="opened_value">0</span></h3>
    </div>
    <div
      id="email_clicked_chart"
      class="card"
      style="
        flex: 1;
        min-width: 200px;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #7a4f01;
        color: white;
        text-align: center;
        font-weight: bold;
      "
    >
      <h3>Clicked Link <span id="clicked_value">0</span></h3>
    </div>
    <div
      id="email_submitted_data_chart"
      class="card"
      style="
        flex: 1;
        min-width: 200px;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #303645;
        color: white;
        text-align: center;
        font-weight: bold;
      "
    >
      <h3>Submitted Data <span id="submitted_value">0</span></h3>
    </div>
    <div
      id="email_reported_chart"
      class="card"
      style="
        flex: 1;
        min-width: 200px;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #7a0c2e;
        color: white;
        text-align: center;
        font-weight: bold;
      "
    >
      <h3>Training Completed <span id="submitted_value">0</span></h3>
    </div>
  </div>

  <ul class="nav nav-tabs mt-10" role="tablist">
    <li class="active" role="presentation">
      <a
        href="#chartsTab"
        aria-controls="chartsTab"
        role="tab"
        data-toggle="tab"
        >Charts</a
      >
    </li>
    <li role="presentation">
      <a href="#tableTab" aria-controls="tableTab" role="tab" data-toggle="tab"
        >Recent Campaign</a
      >
    </li>
  </ul>

  <br />

  <div class="tab-content">
    <!-- Charts Tab -->
    <div role="tabpanel" class="tab-pane active" id="chartsTab">
      <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
      </div>
      <div id="dashboard">
        <!-- <div class="row">
          <div class="col-lg-1 col-md-1"></div>
          <div
            id="sent_chart"
            style="height: 200px"
            class="col-lg-2 col-md-2"
          ></div>
          <div
            id="opened_chart"
            style="height: 200px"
            class="col-lg-2 col-md-2"
          ></div>
          <div
            id="clicked_chart"
            style="height: 200px"
            class="col-lg-2 col-md-2"
          ></div>
          <div
            id="submitted_data_chart"
            style="height: 200px"
            class="col-lg-2 col-md-2"
          ></div>
          <div
            id="email_reported_chart"
            style="height: 200px"
            class="col-lg-2 col-md-2"
          ></div>
          <div class="col-lg-1 col-md-1"></div>
        </div> -->

        <!-- <div id="histogram_container" style="width: 100%; height: 400px"></div> -->

        <div
          class="row"
          style="
            background-color: #62c1a34d;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.286);
          "
        >
          <div
            id="histogram_container"
            style="height: 400px"
            class="col-lg-6 col-md-6 col-sm-12 col-xs-12"
          ></div>

          <div
            id="overview_chart"
            style="height: 400px"
            class="col-lg-6 col-md-6 col-sm-12 col-xs-12"
          ></div>
        </div>
      </div>
    </div>

    <!-- Table Tab -->
    <div role="tabpanel" class="tab-pane" id="tableTab">
      <!-- <div class="row">
        <div class="col-lg-2 col-md-2 col-sm-12 col-xs-12">
          <a href="/campaigns">
            <button type="button" class="btn btn-primary">View All</button>
          </a>
        </div>
      </div> -->
      <div
        class="row"
        style="
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.286);
          padding: 10px;
          background-color: #62c1a34d;
        "
      >
        <a href="/campaigns">
          <button
            type="button"
            class="btn btn-primary"
            style="margin-bottom: 20px"
          >
            View All
          </button>
        </a>
        <table id="campaignTable" class="table table-striped table-bordered">
          <thead>
            <tr>
              <th class="col-md-2 col-sm-2">Name</th>
              <th class="col-md-2 col-sm-2">Created Date</th>
              <th class="col-md-1 col-sm-1">
                <i class="fa fa-envelope" style="font-size: 20px"></i>
              </th>
              <th class="col-md-1 col-sm-1">
                <i class="fa fa-envelope-open-o" style="font-size: 20px"></i>
              </th>
              <th class="col-md-1 col-sm-1">
                <i class="fa fa-mouse-pointer" style="font-size: 20px"></i>
              </th>
              <th class="col-md-1 col-sm-1">
                <i class="fa fa-exclamation-circle" style="font-size: 20px"></i>
              </th>
              <th class="col-md-1 col-sm-1">
                <i class="fa fa-bullhorn" style="font-size: 20px"></i>
              </th>
              <th class="col-md-1 col-sm-1">Status</th>
              <th class="col-md-2 col-sm-2 no-sort">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/dashboard.min.js"></script>
{{end}}
